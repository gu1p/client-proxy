[project]
name = "client-proxy"
version = "0.1.0"
description = "Client wrapper that redirects uv/npm/pnpm caches to an external SSD."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10.6",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "coverage[toml]>=7.6.12",
    "mypy>=1.15.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.6",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
pretty = true
show_error_codes = true
files = ["main.py"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "e2e: end-to-end wrapper execution tests",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["main"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
